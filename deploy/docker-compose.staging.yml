# Nombra el proyecto de compose explícitamente — evita que Docker lo derive del
# nombre del directorio ("deploy"). NOTA: si ya desplegaste antes con el nombre
# de proyecto por defecto, este cambio hace que Compose cree redes/volúmenes
# NUEVOS (prefijo urbanos-staging_ en vez de deploy_) la próxima vez que
# despliegues — no reutiliza los viejos automáticamente.
name: urbanos-staging

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: urbanos-db-staging
    restart: unless-stopped
    mem_limit: 300m
    memswap_limit: 300m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal_db}
      POSTGRES_USER: ${POSTGRES_USER:-portal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - urbanos-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal_user} -d ${POSTGRES_DB:-portal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: urbanos-minio-staging
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9005:9001"
    volumes:
      - minio_data_staging:/data
    networks:
      - urbanos-staging-network
      - prod-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: urbanos-minio-init-staging
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - urbanos-staging-network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://urbanos-minio-staging:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/portal-inmuebles &&
      mc anonymous set download local/portal-inmuebles &&
      echo 'Bucket portal-inmuebles listo'
      "

  migrator:
    build:
      context: ../Backend
      dockerfile: src/Portal.Api/Dockerfile
      target: migrator
    container_name: urbanos-migrator-staging
    profiles: ["migration"]
    networks:
      - urbanos-staging-network
    environment:
      ConnectionStrings__Default: "Host=urbanos-db-staging;Port=5432;Database=${POSTGRES_DB:-portal_db};Username=${POSTGRES_USER:-portal_user};Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ../Backend
      dockerfile: src/Portal.Api/Dockerfile
      target: runtime
    container_name: urbanos-backend-staging
    restart: unless-stopped
    mem_limit: 350m
    memswap_limit: 350m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - urbanos-staging-network
      - prod-network
    expose:
      - "8080"
    environment:
      # "Development" (no "Staging"/"Production") a propósito: Program.cs solo
      # mapea /openapi y /scalar cuando IsDevelopment() es true. Ver Global
      # Constraints del plan.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=urbanos-db-staging;Port=5432;Database=${POSTGRES_DB:-portal_db};Username=${POSTGRES_USER:-portal_user};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: portal-api
      Jwt__Audience: portal-frontend
      Cors__AllowedOrigins__0: "https://${STAGING_DOMAIN}"
      # Público a propósito, NO el hostname interno de Docker: el SDK de S3
      # firma las URLs prefirmadas (SigV4) con este host, y esa firma debe
      # coincidir con el Host que MinIO recibe. Un cliente fuera del VPS
      # nunca puede resolver urbanos-minio-staging, así que firmar con el
      # host interno rompe toda subida desde el navegador. nginx enruta
      # /portal-inmuebles/ (ver nginx-fragment-staging.conf) preservando
      # Host y path para que la firma valide. El hairpin del propio backend
      # hacia este mismo dominio está confirmado que funciona en el VPS.
      Storage__Endpoint: "https://${STAGING_DOMAIN}"
      Storage__Bucket: portal-inmuebles
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__ForcePathStyle: "true"
      Storage__UrlPublicaBase: "https://${STAGING_DOMAIN}/storage/portal-inmuebles"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ../FrontEndUrbanos
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_APP_NAME: "Portal Inmobiliario (Staging)"
    container_name: urbanos-frontend-staging
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - urbanos-staging-network
      - prod-network
    expose:
      - "80"
    depends_on:
      - api

networks:
  urbanos-staging-network:
    driver: bridge
  prod-network:
    external: true
    name: tiviplay_tiviplay-network

volumes:
  postgres_data_staging:
  minio_data_staging:
