# Config COMPLETA (:80 + :443). Se monta recien cuando el certificado ya existe
# Y los contenedores upstream ya estan arriba — si no, nginx muere con
# "host not found in upstream". deploy.sh respeta ese orden.
#
# ${STAGING_DOMAIN} lo resuelve el entrypoint de la imagen nginx via envsubst
# (por eso este archivo se monta en /etc/nginx/templates/, no en conf.d). Solo
# se sustituyen variables que existen en el environment, asi que $host,
# $remote_addr y demas variables de nginx pasan intactas.

# HTTP -> HTTPS
server {
    listen 80;
    server_name ${STAGING_DOMAIN};

    # Debe seguir servido en :80: certbot renueva por HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${STAGING_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${STAGING_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${STAGING_DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Las fotos de inmuebles suben por aca.
    client_max_body_size 20M;

    # Ambiente de pruebas: que no lo indexe nadie.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Backend API
    location /api/ {
        proxy_pass http://urbanos-backend-staging:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scalar (UI de documentacion) + spec OpenAPI. Existen solo porque el backend
    # corre con ASPNETCORE_ENVIRONMENT=Development; en produccion no van.
    location /scalar {
        proxy_pass http://urbanos-backend-staging:8080/scalar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi {
        proxy_pass http://urbanos-backend-staging:8080/openapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://urbanos-backend-staging:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO — lectura publica de las imagenes ya subidas.
    location /storage/ {
        proxy_pass http://urbanos-minio-staging:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;

        proxy_hide_header X-Amz-Request-Id;
        proxy_hide_header X-Amz-Id-2;
    }

    # MinIO — subidas prefirmadas (SigV4). El path debe coincidir EXACTO con lo
    # firmado: Storage__Endpoint es https://<dominio> sin sufijo, asi que la URL
    # prefirmada queda /portal-inmuebles/<key> (bucket en el path, por
    # ForcePathStyle). El proxy_pass va SIN path propio a proposito: asi reenvia
    # la URI tal cual llega y preserva path+query+Host firmados. Agregarle una
    # barra al final rompe la firma y toda subida devuelve 403.
    location /portal-inmuebles/ {
        proxy_pass http://urbanos-minio-staging:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;

        proxy_hide_header X-Amz-Request-Id;
        proxy_hide_header X-Amz-Id-2;
    }

    # Frontend (SPA). Va ultimo: es el catch-all.
    location / {
        proxy_pass http://urbanos-frontend-staging:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
