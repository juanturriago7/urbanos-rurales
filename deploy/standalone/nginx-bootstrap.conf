# Config de ARRANQUE EN FRIO. Solo :80, sin ningun `ssl_certificate`.
#
# Existe porque nginx no arranca si un bloque `listen 443 ssl` apunta a un
# certificado que todavia no existe: entra en crash-loop y entonces certbot no
# puede completar el challenge HTTP-01, que necesita justamente que nginx este
# sirviendo. Huevo y gallina. Se rompe sirviendo primero solo :80.
#
# deploy.sh monta este archivo, pide el certificado, y recien despues cambia a
# nginx.conf (la config completa con :443).

server {
    listen 80;
    server_name _;

    # Webroot del challenge ACME. Debe coincidir con el -w que usa certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        add_header Content-Type text/plain;
        return 200 'urbanos staging - esperando certificado TLS';
    }
}
