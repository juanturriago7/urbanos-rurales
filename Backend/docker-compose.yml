services:
  # ─── PostgreSQL 16 con extensiones necesarias ────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_pass
    ports:
      # 5433 en el host: el 5432 lo ocupa el servicio nativo PostgreSQL de Windows.
      # Dentro de la red de compose la API sigue hablando por el 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # El esquema NO se crea aquí: las migraciones se aplican con EF
      # (Update-Database desde la consola del administrador de paquetes)
      # una vez el contenedor está arriba.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all

  # ─── MinIO: almacenamiento de objetos compatible con S3 ─────────────────────
  # Las imágenes de los inmuebles no viven en el filesystem del servidor (RNF-013).
  # En producción se apunta a AWS S3, DigitalOcean Spaces o Cloudflare R2 cambiando
  # solo la sección Storage de la configuración: el protocolo es el mismo.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: portal_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: portal_minio
      MINIO_ROOT_PASSWORD: portal_minio_pass
    ports:
      - "9002:9000"   # API S3
      - "9003:9001"   # consola web
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea el bucket y lo deja de lectura pública para que el navegador muestre las
  # imágenes por URL directa. Corre una vez y termina.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: portal_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 portal_minio portal_minio_pass &&
      mc mb --ignore-existing local/portal-inmuebles &&
      mc anonymous set download local/portal-inmuebles &&
      echo 'Bucket portal-inmuebles listo'
      "

  # ─── Portal API (.NET 10) ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/Portal.Api/Dockerfile
    container_name: portal_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=portal_db;Username=portal_user;Password=portal_pass"
      Jwt__Key: "${JWT_KEY:-change-this-in-production}"
      Jwt__Issuer: "portal-api"
      Jwt__Audience: "portal-frontend"
      # Dentro de la red de compose se habla con minio:9000; la URL pública que
      # se guarda en imagenes.url_cdn tiene que ser alcanzable desde el navegador.
      Storage__Endpoint: "http://minio:9000"
      Storage__Bucket: "portal-inmuebles"
      Storage__AccessKey: "portal_minio"
      Storage__SecretKey: "portal_minio_pass"
      Storage__UrlPublicaBase: "http://localhost:9002/portal-inmuebles"
      Storage__ForcePathStyle: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
